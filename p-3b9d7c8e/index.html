const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},key,d(P.c));
  return new TextDecoder().decode(pt);}
function show(html,raw){try{if(raw)sessionStorage.setItem('pk',typeof raw==='string'?raw:btoa(String.fromCharCode(...raw)));}catch(_){}document.open();document.write(html);document.close();}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d(P.s),iterations:P.n},base,256));}

document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='Opening…';
  let html,raw;try{raw=await derive(document.getElementById('pw').value);html=await open_(raw);
    try{if(document.getElementById('rem').checked)localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}}
  catch(err){m.textContent='Wrong password.';return;}show(html,raw);};
