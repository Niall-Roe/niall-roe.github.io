<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peirce — On the Theory of Errors of Observations (interactive)</title>
<style>
  :root {
    --page:      #f4f1ea;
    --paper:     #ffffff;
    --ink:       #1f2328;
    --ink-soft:  #575d66;
    --ink-faint: #8a9099;
    --rule:      #dbd6cb;
    --rule-soft: #ece8df;
    --wash:      #faf8f3;
    --accent:    #2f6f9f;   /* the quantity observed */
    --accent-2:  #b0563f;   /* the error */
    --accent-3:  #4a7c59;   /* the unknown quantity: truth, or what is approached */
    --accent-4:  #9a7b3f;   /* remarks and asides */
    --tint:      rgba(47, 111, 159, .10);
    --tint-2:    rgba(176, 86, 63, .10);
    --tint-3:    rgba(74, 124, 89, .12);
    --tint-4:    rgba(154, 123, 63, .12);
  }

  body {
    font-family: 'Georgia', serif;
    line-height: 1.8;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    font-size: 16px;
    background-color: var(--page);
    color: var(--ink);
  }

  .article-container {
    background-color: var(--paper);
    padding: 52px 56px;
    box-shadow: 0 1px 3px rgba(60, 50, 30, .10);
    border-radius: 2px;
  }

  h3 { text-align: center; font-variant: small-caps; margin-top: 40px; margin-bottom: 6px; letter-spacing: 1px; font-size: 1.6em; }
  h4 { text-align: center; font-weight: normal; margin-bottom: 10px; color: var(--ink-soft); }

  p { text-align: justify; margin-bottom: 15px; position: relative; }  /* positioning context for .ex-num */

  .formula { text-align: center; margin: 24px 0; font-family: 'Times New Roman', Georgia, serif; font-style: italic; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
  .frac > .num { border-bottom: 1px solid currentColor; padding: 0 4px; }
  .frac > .den { padding: 0 4px; }

  .peirce-table { border-collapse: collapse; margin: 20px auto; }
  .peirce-table th, .peirce-table td { border: 1px solid var(--rule); padding: 6px 16px; text-align: center; }

  sup, sub { font-size: .75em; }

  /* ======================================================================
     Below here is the example apparatus, carried over from the Probability
     of Induction page so that the two read as one series.
     ==================================================================== */
h5 {
    font-size: .82em;
    font-weight: 400;
    font-variant: small-caps;
    letter-spacing: .09em;
    color: var(--ink-faint);
    margin: 22px 0 8px 0;
  }
.section-number {
    text-align: center;
    font-size: 1.2em;
    margin: 40px 0 20px 0;
    font-weight: bold;
  }
/* ------------------------------------------------------------------------
     Example numbers in the gutter, for referring to them elsewhere. The marker
     is inserted at the head of its trigger and positioned with `left` only, so
     its vertical place is the static one — the trigger's own first line, which
     is what makes two examples in one paragraph land separately.
     ----------------------------------------------------------------------*/
.ex-num {
    position: absolute;
    left: -46px;
    width: 34px;
    text-align: right;
    font-size: .78em;
    line-height: 1.85;
    letter-spacing: .03em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    user-select: none;
    pointer-events: none;
  }
/* the gutter is the container's own 56px of padding, which narrows to 20 at
     the same breakpoint the rest of the layout stacks — no room for it there */
@media (max-width: 720px) { .ex-num { display: none; } }
/* ------------------------------------------------------------------------
     The trigger. A whole paragraph is often the anchor, so a fill would tint
     half the page; a hairline under the run of text marks its extent without
     competing with the prose. The fill appears only on hover, to show how far
     the passage reaches.
     ----------------------------------------------------------------------*/
.example-trigger, .example-trigger-yellow {
    cursor: pointer;
    padding: 0;
    border-radius: 1px;
    background-color: transparent;
    transition: background-color .22s ease, border-color .22s ease;
  }
/* Solid and very pale: a whole paragraph of dotted rule reads as texture,
     a whole paragraph of this reads as a margin note. */
.example-trigger        { border-bottom: 1px solid rgba(47, 111, 159, .28); }
.example-trigger-yellow { border-bottom: 1px solid rgba(154, 123, 63, .32); }
.example-trigger:hover        { background-color: var(--tint);   border-bottom-color: var(--accent); }
.example-trigger-yellow:hover { background-color: var(--tint-4); border-bottom-color: var(--accent-4); }
.example-trigger.is-open, .example-trigger-yellow.is-open {
    border-bottom-style: solid;
    border-bottom-color: var(--rule);
    background-color: transparent;
  }
/* ------------------------------------------------------------------------
     The example itself. grid-template-rows 0fr -> 1fr animates to the content's
     own height with nothing measured in script; the inner div does the
     clipping. Margin travels with it so the space closes up too.
     ----------------------------------------------------------------------*/
.example-container {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    margin: 0;
    transition: grid-template-rows .55s cubic-bezier(.22, .61, .36, 1),
                margin .55s cubic-bezier(.22, .61, .36, 1),
                opacity .3s ease;
  }
.example-container.open {
    grid-template-rows: 1fr;
    opacity: 1;
    margin: 34px 0 38px 0;
  }
.example-container > .ex-inner { overflow: hidden; min-height: 0; }
.example-header {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: .8em;
    font-variant: small-caps;
    letter-spacing: .1em;
    font-weight: 400;
    color: var(--ink-faint);
    cursor: pointer;
    user-select: none;
    margin-bottom: 22px;
  }
.example-header:before {
    content: '\25BE';
    font-size: .9em;
    line-height: 1;
    transition: transform .25s ease;
  }
.example-header.collapsed:before { transform: rotate(-90deg); }
.example-header:after {
    content: '';
    flex: 1;
    height: 1px;
    background-color: var(--rule-soft);
  }
.example-header:hover { color: var(--ink-soft); }
.example-content { margin-top: 0; }
/* ------------------------------------------------------------------------
     Numbers in Peirce's own text, driven by the sliders below them. Dormant
     they are indistinguishable from the prose; live they take the colour of
     the control moving them.
     ----------------------------------------------------------------------*/
.live { transition: color .25s ease, background-color .4s ease; }
.live.is-live {
    font-variant-numeric: tabular-nums;
    background-color: var(--tint);
    border-radius: 2px;
    padding: 0 1px;
  }
/* The tint suits a numeral. It does not suit a clause, where it becomes a
     block of colour across three lines, nor a fraction, where it sits under
     the rule and shifts it. In both, the colour alone does the tying. */
.frac .live.is-live, .peirce-table .live.is-live, .live.is-live.phrase {
    background-color: transparent;
    padding: 0;
  }
.live.is-live.k1 { color: var(--accent);   background-color: var(--tint); }
.live.is-live.k2 { color: var(--accent-2); background-color: var(--tint-2); }
.live.is-live.k3 { color: var(--accent-3); background-color: var(--tint-3); }
.live.is-live.k4 { color: var(--accent-4); background-color: var(--tint-4); }
.ctl.k1 input[type=range] { accent-color: var(--accent); }
.ctl.k2 input[type=range] { accent-color: var(--accent-2); }
.ctl.k3 input[type=range] { accent-color: var(--accent-3); }
.ctl.k4 input[type=range] { accent-color: var(--accent-4); }
.ctl.k1 .slider-val { color: var(--accent); }
.ctl.k2 .slider-val { color: var(--accent-2); }
.ctl.k3 .slider-val { color: var(--accent-3); }
.ctl.k4 .slider-val { color: var(--accent-4); }
.restore-peirce {
    font-size: .8em;
    font-variant: small-caps;
    letter-spacing: .07em;
    color: var(--ink-faint);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 0;
    margin: 2px 0 10px 0;
    border-bottom: 1px dotted var(--rule);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
.restore-peirce.on { opacity: 1; pointer-events: auto; }
.mode-tabs .restore-peirce { margin: 0 0 8px 22px; align-self: center; }
.restore-peirce:hover { color: var(--ink-soft); }
/* ------------------------------------------------------------------------
     Peirce's three terms, coloured in his own sentence rather than only in the
     legend below it. Dormant they are ordinary text; the colour arrives with
     the example, on the same rule as the live numbers.
     ----------------------------------------------------------------------*/
.hl-text {
    border-radius: 2px;
    padding: 1px 3px;
    margin: 0 -3px;
    background-color: transparent;
    transition: background-color .35s ease;
  }
.hl-text.hl-on.a { background-color: rgba(154, 123, 63, .16); }
.hl-text.hl-on.c { background-color: rgba(47, 111, 159, .14); }
.hl-text.hl-on.q { background-color: rgba(74, 124, 89, .16); }
/* A clause that owns a stretch of a slider's travel: it lights as the slider
     enters its range and fades as it leaves, so the paragraph reads as a
     running commentary on where the control is. Slow enough to be a fade and
     not a flicker while dragging. */
.hl-band {
    border-radius: 2px;
    padding: 1px 3px;
    margin: 0 -3px;
    background-color: transparent;
    transition: background-color .45s ease;
  }
.hl-band.band-on { background-color: rgba(47, 111, 159, .26); }
@media (prefers-reduced-motion: reduce) { .hl-band { transition: none; } }
.calc-output {
    background: none;
    border: none;
    border-left: 2px solid var(--rule);
    border-radius: 0;
    padding: 2px 0 2px 18px;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    margin-top: 16px;
    white-space: pre-wrap;
    font-size: .78em;
    line-height: 1.65;
    color: var(--ink-soft);
    overflow-x: auto;
  }
.key-insight {
    background: none;
    border: none;
    border-left: 2px solid var(--accent-4);
    border-radius: 0;
    padding: 1px 0 1px 18px;
    margin: 20px 0;
    font-style: italic;
  }
.key-insight strong { font-style: normal; }
.note-block {
    font-size: .9em;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-left: 2px solid var(--rule);
    padding: 1px 0 1px 18px;
    margin: 16px 0;
    font-family: inherit;
  }
.click-info {
    padding: 1px 0 1px 18px;
    background: none;
    border: none;
    border-left: 2px solid var(--accent-4);
    border-radius: 0;
    margin-top: 16px;
    font-size: .95em;
  }
.help-text { color: var(--ink-faint); font-style: italic; text-align: left; }
.control-panel, .plot-container, .group-box {
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0 0 18px 0;
  }
.plot-container { margin: 18px 0; }
.result-box {
    padding: 16px 0 0 0;
    margin-top: 22px;
    background: none;
    border: none;
    border-top: 1px solid var(--rule-soft);
    border-radius: 0;
  }
.mode-tabs {
    display: flex;
    gap: 24px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rule-soft);
  }
.mode-tab {
    padding: 3px 0 8px 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
    font-family: inherit;
    font-size: .95em;
    font-weight: 400;
    font-variant: small-caps;
    letter-spacing: .06em;
    color: var(--ink-faint);
    transition: color .2s, border-color .2s;
  }
.mode-tab:hover { color: var(--ink-soft); }
.mode-tab.active {
    background: none;
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
.ctl { margin-bottom: 16px; }
.ctl > label {
    display: block;
    font-family: inherit;
    font-size: .92em;
    font-weight: 400;
    color: var(--ink-soft);
    margin-bottom: 2px;
    line-height: 1.5;
  }
.ctl select, .ctl input[type=number] {
    width: 100%;
    padding: 4px 2px;
    border: none;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    font-family: inherit;
    font-size: 1em;
    color: var(--ink);
    background: transparent;
  }
.ctl select:focus, .ctl input[type=number]:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
.ctl input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    margin: 2px 0;
  }
.ctl .slider-val {
    font-family: inherit;
    font-size: .95em;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
.ctl.checkbox label {
    display: flex; align-items: center; gap: 8px; font-weight: 400;
  }
.ctl.checkbox input { width: auto; accent-color: var(--accent); }
.ctl .radio-row { display: flex; gap: 18px; flex-wrap: wrap; }
.ctl .radio-row.stacked { flex-direction: column; gap: 4px; }
.ctl .radio-row label {
    display: flex; align-items: center; gap: 6px;
    font-family: inherit;
    font-size: .95em; font-weight: 400; cursor: pointer;
    color: var(--ink-soft);
  }
.ctl .radio-row input { accent-color: var(--accent); }
/* Buttons set as small caps in the text face, outlined rather than filled —
     they sit in the column beside the prose and should not shout across it. */
button.btn {
    font-family: inherit;
    font-size: .88em;
    font-variant: small-caps;
    letter-spacing: .05em;
    padding: 5px 13px;
    margin: 3px 4px 3px 0;
    border: 1px solid var(--rule);
    border-radius: 3px;
    cursor: pointer;
    background: none;
    color: var(--ink-soft);
    transition: color .18s, border-color .18s, background-color .18s;
  }
button.btn:hover { background-color: var(--wash); color: var(--ink); border-color: var(--ink-faint); }
button.btn.is-active {
    background-color: var(--tint-4);
    border-color: var(--accent-4);
    color: var(--accent-4);
  }
button.btn-primary   { color: var(--accent);   border-color: rgba(47, 111, 159, .45); }
button.btn-success   { color: var(--accent-3); border-color: rgba(74, 124, 89, .45); }
button.btn-warning   { color: var(--accent-4); border-color: rgba(154, 123, 63, .50); }
button.btn-danger    { color: var(--accent-2); border-color: rgba(176, 86, 63, .45); }
button.btn-info      { color: var(--accent);   border-color: rgba(47, 111, 159, .45); }
button.btn-secondary { color: var(--ink-soft); border-color: var(--rule); }
button.btn-primary:hover   { background-color: var(--tint);   color: var(--accent); }
button.btn-success:hover   { background-color: var(--tint-3); color: var(--accent-3); }
button.btn-warning:hover   { background-color: var(--tint-4); color: var(--accent-4); }
button.btn-danger:hover    { background-color: var(--tint-2); color: var(--accent-2); }
button.btn-info:hover      { background-color: var(--tint);   color: var(--accent); }
button.btn-block     { display: block; width: 100%; margin: 4px 0; }
/* A row of actions laid out across the column rather than stacked down the
     side of it, so the graphic they drive stays in view with the prose. */
.ex-buttonbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 6px;
    margin-bottom: 16px;
  }
.ex-buttonbar .btn { margin: 0; }
button.btn-lg        { font-size: 1em; padding: 8px 18px; }
button.btn-sm        { font-size: .8em; padding: 3px 9px; }
/* ex8 stacks two grids — the arguments, then the reading. Giving both the
     same column template and gutter puts every track on one axis, so the
     sliders and the number lines share a left edge, a right edge and therefore
     a midpoint, and the values line up under each other. */
#ex8-content .conv-grid,
  #ex8-content .nl-grid {
    grid-template-columns: 11em minmax(0, 1fr) 12em;
    column-gap: 20px;
  }
@media (max-width: 720px) {
    .conv-grid { grid-template-columns: 1fr; gap: 4px 0; }
    .conv-lbl { text-align: left; margin-top: 12px; }
    .conv-head { display: none; }
  }
.ex7-work-line {
    text-align: center;
    font-size: 1.05em;
    margin: 0 0 4px 0;
  }
#ex7-plot { margin: 12px 0 0 0; }
/* ------------------------------------------------------------------------
     The row of urns (ex28). One urn per proportion, balls stacked inside it,
     drawn in the text rather than in a canvas so that they scale with the page.
     ----------------------------------------------------------------------*/
.urn-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 14px 12px;
    margin: 20px 0 12px 0;
  }
.urn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
.urn-balls {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 2px;
    padding: 5px 5px 6px 5px;
    border: 1px solid var(--rule);
    border-top: none;
    border-radius: 0 0 9px 9px;
    background-color: var(--wash);
  }
.urn-ball {
    display: inline-block;          /* so it also works outside the urn stack */
    width: 13px; height: 13px; border-radius: 50%;
    border: 1px solid var(--ink-faint);
  }
.urn-ball.w { background-color: var(--paper); }
.urn-ball.b { background-color: #4f555c; border-color: #4f555c; }
.urn-lab {
    font-size: .78em;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
.urn-ball.empty { background-color: transparent; border-style: dotted; }
.urn-row-tight { gap: 8px 5px; }
.urn-row-tight .urn-ball { width: 8px; height: 8px; }
.urn-row-tight .urn-balls { padding: 3px 3px 4px 3px; gap: 1px; border-radius: 0 0 6px 6px; }
.urn-row-tight .urn-lab { display: none; }
.urn.dim { opacity: .22; }
.urn { transition: opacity .25s ease; }
.urn-ball.ringed { box-shadow: 0 0 0 2px var(--accent-3); }
.draw-row {
    display: flex; justify-content: center; align-items: flex-start;
    gap: 30px; margin: 18px 0 20px 0;
  }
.draw-slot { text-align: center; }
.draw-ball {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid var(--ink-faint); margin: 0 auto 6px auto;
  }
.draw-ball.w { background-color: var(--paper); }
.draw-ball.b { background-color: #4f555c; border-color: #4f555c; }
.draw-ball.q {
    background-color: var(--wash); border-style: dashed; border-color: var(--accent-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em; color: var(--accent-3);
  }
.draw-ball.q:after { content: "?"; }
.draw-lab {
    font-size: .76em; font-variant: small-caps; letter-spacing: .07em;
    color: var(--ink-faint);
  }
.thirds-row {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 5px; margin-bottom: 4px;
  }
/* ------------------------------------------------------------------------
     The argument set as a sentence, with its choices as words in it (ex1).
     ----------------------------------------------------------------------*/
.arg-line {
    position: relative;          /* the little menus hang off this */
    text-align: left;
    font-size: 1.12em;
    line-height: 2.2;
    margin: 6px 0 18px 0;
  }
.arg-pick {
    font-family: inherit;
    font-size: 1em;
    font-weight: 700;
    color: inherit;
    background: none;
    border: none;
    border-bottom: 1px dotted currentColor;
    padding: 0 1px;
    cursor: pointer;
  }
.arg-pick:hover { background-color: rgba(0, 0, 0, .06); }
.arg-menu {
    position: absolute;
    z-index: 5;
    display: flex;
    flex-direction: column;
    min-width: 9em;
    padding: 3px;
    background-color: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: 0 3px 10px rgba(60, 50, 30, .14);
  }
.arg-opt {
    font-family: inherit;
    font-size: .82em;
    line-height: 1.5;
    text-align: left;
    background: none;
    border: none;
    border-radius: 2px;
    padding: 3px 7px;
    color: var(--ink-soft);
    cursor: pointer;
  }
.arg-opt:hover { background-color: var(--wash); color: var(--ink); }
.arg-opt.on { color: var(--ink); font-weight: 700; }
/* the arrow of the consequence, and the "then" that is the same thing in
     words — a stronger green than the washes either side of it, since it is
     the part that carries the probability */
.arg-rule {
    text-align: center;
    font-size: 1.1em;
    line-height: 2.2;
    margin: 4px 0 16px 0;
  }
.hl-then {
    color: #2f6b45;
    font-weight: 700;
    background-color: rgba(74, 124, 89, .22);
    border-radius: 2px;
    padding: 1px 4px;
    margin: 0 1px;
  }
/* A remark of the editor's rather than a sentence of Peirce's: set in from
     the margin behind a rule, so the page never has to be read twice to see
     whose voice it is in. */
.ed-note {
    border-left: 3px solid var(--accent);
    padding-left: 16px;
    margin-left: 2px;
    color: var(--ink-soft);
  }
/* Where an example reports back inside Peirce's own paragraph, the report is
     tinted so it cannot be mistaken for his sentence carrying on. Figures
     inside it keep the colour of the slider that moves them. */
.ex-reading {
    background-color: rgba(47, 111, 159, .11);
    color: var(--accent);
    border-radius: 2px;
    padding: 1px 3px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
/* ------------------------------------ the paper read as vowels and consonants
     29 asks the rule of succession about the next letter of this article, so
     the article itself has to show its letters. Unread ones are barely tinted;
     the ones the reading has passed are stronger, so the head is visible as a
     boundary running down the page. Letters are wrapped a block at a time as
     blocks come into view — thirty thousand spans at once is not a click. */
.vc { border-radius: 2px; }
.vc-v { background-color: rgba(154, 123, 63, .12); }
.vc-c { background-color: rgba(47, 111, 159, .09); }
.vc-seen.vc-v { background-color: rgba(154, 123, 63, .42); color: #6d552b; }
.vc-seen.vc-c { background-color: rgba(47, 111, 159, .34); color: #234f72; }
.vc-head { outline: 2px solid var(--ink); outline-offset: 0; border-radius: 2px; }
.vc-bar {
    position: relative; height: 38px; margin: 4px 0 2px;
    border: 1px solid var(--rule); border-radius: 3px;
    background-color: rgba(154, 123, 63, .16); overflow: visible;
  }
.vc-bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background-color: rgba(47, 111, 159, .26);
    border-right: 1px solid rgba(47, 111, 159, .5);
    transition: width .18s ease;
  }
.vc-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; transition: left .18s ease; }
.vc-mark-lab {
    position: absolute; font-size: .7em; letter-spacing: .02em; white-space: nowrap;
    transform: translateX(-50%); transition: left .18s ease;
  }
.vc-scale { position: relative; height: 15px; font-size: .7em; color: var(--ink-faint); }
.vc-scale span { position: absolute; transform: translateX(-50%); }
.vc-read {
    font-size: .92em; line-height: 1.7; color: var(--ink-soft);
    max-height: 96px; overflow: hidden;
  }
.vc-read .vc { background-color: transparent; }
.vc-read .vc-v { color: #9a7b3f; font-weight: 700; }
.vc-read .vc-c { color: #2f6f9f; }
.row { display: flex; flex-wrap: wrap; margin: 0 -14px; }
.row > .col { padding: 0 14px; box-sizing: border-box; }
.col-3  { flex: 0 0 25%;      max-width: 25%; }
.col-4  { flex: 0 0 33.3333%; max-width: 33.3333%; }
.col-5  { flex: 0 0 41.6667%; max-width: 41.6667%; }
.col-6  { flex: 0 0 50%;      max-width: 50%; }
.col-7  { flex: 0 0 58.3333%; max-width: 58.3333%; }
.col-8  { flex: 0 0 66.6667%; max-width: 66.6667%; }
.col-12 { flex: 0 0 100%;     max-width: 100%; }
@media (max-width: 720px) {
    .row > .col { flex: 0 0 100%; max-width: 100%; }
    .article-container { padding: 22px 20px; }
    body { padding: 8px; }
  }
canvas.plot { width: 100%; display: block; }
hr { border: none; border-top: 1px solid var(--rule-soft); margin: 20px 0; }
table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-family: inherit;
    font-size: .92em;
    margin-top: 16px;
    background: none;
  }
table.tbl th, table.tbl td {
    border: none;
    border-bottom: 1px solid var(--rule-soft);
    padding: 5px 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
table.tbl th {
    background: none;
    font-weight: 400;
    font-variant: small-caps;
    letter-spacing: .06em;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--rule);
  }
table.tbl tbody tr:nth-child(odd) { background: none; }
table.tbl tr.highlighted-row-90 { background-color: var(--tint) !important; font-weight: 400; color: var(--accent); }
.table-scroll { overflow-x: auto; }
.frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    font-size: .85em;
    line-height: 1.25;
    margin: 0 3px;
  }
.frac > .num { border-bottom: 1px solid currentColor; padding: 0 4px; }
.frac > .den { padding: 0 4px; }
.math { font-family: 'Times New Roman', Georgia, serif; font-style: italic; }
.math .op, .math .num-lit { font-style: normal; }
.peirce-table {
    margin: 22px auto;
    border-collapse: collapse;
    font-size: .95em;
    max-width: 560px;
  }
.peirce-table td { padding: 4px 10px; vertical-align: middle; }
.peirce-table td.lbl { text-align: right; color: var(--ink-soft); }
.peirce-table td:last-child { text-align: left; white-space: nowrap; }
@media (max-width: 720px) {
    .peirce-table { font-size: .82em; }
    .peirce-table td { padding: 4px 5px; }
  }
/* Peirce's probable-error table becomes selectable while ex17 is open: each
     row picks its own confidence level. The seventh row is the reader's, so it
     is not on the page at all until then. */
#ex17-custom-row, #ex16-row1, #ex16-row2 { display: none; }
.peirce-table.ex16-live #ex16-row1,
  .peirce-table.ex16-live #ex16-row2 { display: table-row; }
.peirce-table.ex17-live #ex17-custom-row { display: table-row; }
.peirce-table.ex17-live tr[data-conf] { cursor: pointer; }
.peirce-table.ex17-live tr[data-conf]:hover { background-color: var(--wash); }
.peirce-table.ex17-live tr.conf-active { background-color: var(--tint); }
.rad {
    border-top: 1px solid currentColor;
    padding: 2px 3px 0 3px;
    display: inline-block;
  }
sup.fn { font-size: .7em; line-height: 0; }
sup.fn a { text-decoration: none; color: var(--accent); }
.footer {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--rule-soft);
    font-size: .9em;
    color: var(--ink-soft);
    font-family: inherit;
    text-align: justify;
  }
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .example-container, .example-header:before, .live, .restore-peirce { transition: none; }
  }

  /* ------------------------------------------------------------------------
     The colour key, used the same way throughout this paper: the quantity
     observed, the unknown quantity it is after, and the error between them.
     ----------------------------------------------------------------------*/
  .k-O { color: var(--accent);   }
  .k-T { color: var(--accent-3); }
  .k-e { color: var(--accent-2); }
  .k-est { color: var(--accent-4); }   /* the estimate, and the residual measured from it */
  .hl-text.hl-on.e { background-color: rgba(176, 86, 63, .16); }

  /* Peirce's expression, the modern one, and the same thing with the numbers
     in it: three rows that must read down as well as across, so one grid holds
     all of them and the rows are display: contents. */
  .ex-ladder {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 7px 14px;
    align-items: baseline;
    justify-items: center;
    margin: 28px 0 22px 0;
    text-align: center;
  }
  .ex-ladder .lad-row { display: contents; }
  .ex-ladder .lad-op { color: var(--ink-faint); min-width: 1ch; }
  .lad-words > span { font-size: .88em; line-height: 1.35; color: var(--ink-soft); }
  .lad-words > .k-O, .lad-words > .k-T, .lad-words > .k-e { color: inherit; }
  .lad-words > .k-O { color: var(--accent); }
  .lad-words > .k-T { color: var(--accent-3); }
  .lad-words > .k-e { color: var(--accent-2); }
  .lad-words > .k-est { color: var(--accent-4); }
  .lad-sym > span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 1.32em; font-style: italic;
  }
  .lad-num > span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 1.16em; font-variant-numeric: tabular-nums;
  }
  /* a two-sided statement: the relative number on the left, the law on the
     right, with one operator between them */
  .ex-ladder.cols-3 {
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  }
  .ex-ladder .frac { font-size: .95em; }
  /* Kept OUT of the grid. A grid item spanning every column contributes its
     whole intrinsic width to the one track that is not flexible — the operator
     column — which blows that column out to the width of the sentence. */
  .lad-note {
    font-size: .85em; color: var(--ink-faint);
    text-align: center; max-width: 46em; margin: 2px auto 20px auto;
  }
  @media (max-width: 720px) {
    /* .cols-3 is more specific than .ex-ladder, so it has to be named here or
       the narrow layout never reaches it */
    .ex-ladder, .ex-ladder.cols-3 { grid-template-columns: 1fr; gap: 2px; }
    .ex-ladder .lad-op { display: none; }
  }


  /* ------------------------------------------------------------------------
     Peirce's data tables, pp. 138-158: nine column-pairs read downwards, the
     leading digits printed only where they change. Set tight and small, as
     they are on the page.
     ----------------------------------------------------------------------*/
  .table-scroll { overflow-x: auto; margin: 14px 0 6px 0; }
  .peirce-data-table {
    border-collapse: collapse; margin: 0 auto;
    font-size: .68em; font-variant-numeric: tabular-nums;
  }
  .peirce-data-table caption {
    caption-side: top; font-size: 1.25em; font-variant: small-caps;
    letter-spacing: .08em; color: var(--ink-soft); padding-bottom: 8px;
  }
  .peirce-data-table th {
    font-weight: 400; font-style: italic; font-size: .92em;
    color: var(--ink-faint); padding: 2px 5px;
    border-bottom: 1px solid var(--rule); line-height: 1.15;
  }
  .peirce-data-table td { padding: 0 5px; text-align: right; line-height: 1.35; }
  .peirce-data-table td.pv { color: var(--ink); }
  .peirce-data-table td.pc { color: var(--ink-soft); border-right: 1px solid var(--rule-soft); }
  .peirce-data-table td:last-child { border-right: none; }


  /* ------------------------------------------------------------------------
     The twenty-four days, at the foot of the page. Not an example container:
     it is always open, so it is set off by a rule rather than by a trigger.
     ----------------------------------------------------------------------*/
  .ex3-block {
    position: relative;
    margin: 46px 0 10px 0;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
  }
  .ex3-head {
    font-size: 1em; font-variant: small-caps; letter-spacing: .07em;
    color: var(--ink-soft); margin: 0 0 8px 0;
  }
  .ex3-lead { font-size: .95em; color: var(--ink-soft); margin-bottom: 18px; }

  /* --------------------------------------------------- the month, as a month */
  .cal-wrap { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 16px; }
  .cal-name {
    font-size: .78em; font-variant: small-caps; letter-spacing: .08em;
    color: var(--ink-faint); margin-bottom: 5px; text-align: center;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1.85em); gap: 2px; }
  .cal-dow {
    font-size: .68em; color: var(--ink-faint); text-align: center;
    padding-bottom: 2px;
  }
  .cal-day {
    font-family: inherit; font-size: .8em;
    height: 1.85em; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 2px;
    background: none; padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .cal-day.off { color: var(--ink-faint); opacity: .45; }
  .cal-day.blank { border: none; }
  .cal-day.has {
    cursor: pointer; color: var(--accent);
    border-color: rgba(47, 111, 159, .35);
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .cal-day.has:hover { background-color: var(--tint); }
  .cal-day.has.is-on {
    background-color: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 700;
  }
  /* a hairline between a pair of view buttons and the controls they govern */
  .bar-sep {
    display: inline-block; width: 1px; height: 1.4em;
    background: var(--rule); margin: 0 6px;
  }

  /* the day's table sits under its plot, in the same column as it, so the
     controls on the left stay beside both */
  .ex3-day-table { max-height: 300px; overflow-y: auto; margin-top: 10px; }

  .plate-orig { margin: 8px 0 0 0; }
  .plate-orig img { max-width: 100%; border: 1px solid var(--rule-soft); }

  .footnotes { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: .9em; color: var(--ink-soft); }
  .footnotes li { margin-bottom: 10px; }

  figure { text-align: center; margin: 30px 0; }
  figure img { max-width: 100%; }
  figcaption { font-size: .85em; color: var(--ink-faint); margin-top: 8px; }

  .peirce-pi { font-style: italic; }

  /* Peirce's "inverted comma" (p.115): an ordinary comma, mirrored left-right,
     sitting at normal comma height. */
  .inv-comma { display: inline-block; transform: scaleX(-1); }

  /* Peirce's glyph for e, the base of natural logarithms: a small spiral. */
  .peirce-e { display: inline-block; width: .8em; height: .8em; vertical-align: -.06em; }
  .peirce-e .swirl { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Product sign with its limits above and below, as printed. */
  .bigprod { display: inline-flex; flex-direction: column; align-items: center;
             vertical-align: middle; line-height: 1; margin: 0 .12em; }
  .bigprod .lim { font-size: .6em; }
  .bigprod .sym { font-size: 1.15em; line-height: 1; }

  .rad { border-top: 1px solid currentColor; padding: 2px 3px 0 3px; display: inline-block; }
  .peirce-defs { list-style: none; padding-left: 1.5em; margin-bottom: 15px; }
  .peirce-defs li { margin-bottom: 4px; }
  .prose-gap { border: 1px dashed var(--rule); background: var(--wash); color: var(--ink-faint); padding: 10px 16px; margin: 15px 0; font-size: .85em; font-style: italic; }
</style>
</head>
