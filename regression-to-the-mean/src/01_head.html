<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regression to the Mean: Galton&rsquo;s Two-Stage Quincunx</title>
<style>
  :root {
    /* A colour on this page names one thing and keeps naming it: the chutes
       and the reversion coefficient that sets them; the population; one traced
       family; the environment and the mean it moves. */
    --chute:     #ef6c00;
    --pop:       #1565c0;
    --family:    #6a1b9a;
    --env:       #00695c;
    --tint:      rgba(239, 108, 0, .10);
    --tint-2:    rgba(21, 101, 192, .10);
    --tint-3:    rgba(106, 27, 154, .10);
    --tint-4:    rgba(0, 105, 92, .10);
  }

  body {
    font-family: 'Georgia', serif;
    line-height: 1.7;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    font-size: 16px;
    background-color: #fafafa;
    color: #212529;
  }

  .article-container {
    background-color: white;
    padding: 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
  }

  h1.page-title {
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 1px;
    margin-top: 0;
    margin-bottom: 4px;
    font-size: 1.9em;
  }
  p.lede {
    text-align: justify;
    color: #444;
    margin: 0 auto 28px auto;
    max-width: 46em;
  }

  h3 {
    text-align: center;
    font-variant: small-caps;
    margin-top: 40px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  h4 { margin: 18px 0 10px 0; }

  p { text-align: justify; margin-bottom: 15px; }

  hr { border: none; border-top: 1px solid #dee2e6; margin: 22px 0; }

  /* ------------------------------------------------------------------------
     Numbers in the prose, driven by the controls below them. Each takes the
     colour of the control that moves it.
     ----------------------------------------------------------------------*/
  .live {
    font-variant-numeric: tabular-nums;
    border-radius: 2px;
    padding: 0 1px;
    transition: color .25s ease;
  }
  .live.k1 { color: var(--chute);  background-color: var(--tint); }
  .live.k2 { color: var(--pop);    background-color: var(--tint-2); }
  .live.k3 { color: var(--family); background-color: var(--tint-3); }
  .live.k4 { color: var(--env);    background-color: var(--tint-4); }

  /* ---- controls ---- */
  .ctl { margin-bottom: 14px; }
  .ctl > label {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .ctl input[type=range] { width: 100%; }
  .ctl.checkbox label {
    display: flex; align-items: center; gap: 8px; font-weight: 500;
  }
  .ctl.checkbox input { width: auto; }
  .ctl .slider-val {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85em;
    color: #2c7fb8;
    font-weight: 700;
  }
  /* the driving slider wears the colour of the numbers it moves */
  .ctl.k1 input[type=range] { accent-color: var(--chute); }
  .ctl.k2 input[type=range] { accent-color: var(--pop); }
  .ctl.k3 input[type=range] { accent-color: var(--family); }
  .ctl.k4 input[type=range] { accent-color: var(--env); }
  .ctl.k1 .slider-val { color: var(--chute); }
  .ctl.k2 .slider-val { color: var(--pop); }
  .ctl.k3 .slider-val { color: var(--family); }
  .ctl.k4 .slider-val { color: var(--env); }
  .ctl.off > label { opacity: 0.45; }
  .ctl.off input { opacity: 0.45; }

  button.btn {
    width: 100%;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
    font-weight: 600;
    padding: 8px 12px;
    margin: 0 0 8px 0;
    border: 1px solid #b0bec5;
    border-radius: 4px;
    cursor: pointer;
    background-color: #fff;
    color: #37474f;
  }
  button.btn:hover { background-color: #eceff1; }
  button.btn:active { background-color: #cfd8dc; }
  button.btn.primary {
    border-color: var(--pop);
    color: var(--pop);
  }
  button.btn.primary:hover { background-color: #eaf2fb; }
  button.btn:disabled { opacity: 0.45; cursor: default; background-color: #fff; }

  .help-text {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.82em;
    color: #6c757d;
    margin: -8px 0 12px 0;
  }

  /* ---- layout ---- */
  .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
  .row > .col { padding: 0 10px; box-sizing: border-box; }
  .col-4  { flex: 0 0 33.3333%; max-width: 33.3333%; }
  .col-8  { flex: 0 0 66.6667%; max-width: 66.6667%; }
  @media (max-width: 800px) {
    .row > .col { flex: 0 0 100%; max-width: 100%; }
    .article-container { padding: 18px; }
    body { padding: 8px; }
    p { text-align: left; }
  }

  .sidebar {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 18px;
  }
  .sidebar hr { margin: 16px 0; }
  .sidebar h4 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.76em;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #78909c;
    margin: 0 0 10px 0;
  }

  canvas.plot { width: 100%; display: block; }
  .plot-container {
    margin: 0 0 16px 0;
    padding: 10px;
    background-color: white;
    border-radius: 4px;
    border: 1px solid #ddd;
  }
  .plot-hint {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78em;
    color: #6c757d;
    text-align: center;
    margin: 4px 0 0 0;
  }

  /* ---- the readout under the apparatus ---- */
  .readout {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
    border: 1px solid #dee2e6;
    border-radius: 5px;
    padding: 12px 16px;
    margin: 0 0 14px 0;
    background: #fbfcfd;
  }
  .readout .rrow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 3px 0;
  }
  .readout .rrow .lbl { color: #546e7a; }
  .readout .rrow .val {
    font-variant-numeric: tabular-nums; font-weight: 700; color: #37474f;
  }
  .readout .rrow .val.pop    { color: var(--pop); }
  .readout .rrow .val.family { color: var(--family); }
  .readout .rrow .val.chute  { color: var(--chute); }
  .readout .rrow .val.env    { color: var(--env); }
  .readout .gen {
    font-variant: small-caps; letter-spacing: 0.6px; font-weight: 700;
    color: #37474f; border-bottom: 1px solid #e4e9ee;
    padding-bottom: 5px; margin-bottom: 6px;
  }
  .readout .sentence {
    margin: 8px 0 0 0; padding-top: 8px; border-top: 1px solid #e4e9ee;
    color: #455a64; line-height: 1.55; font-size: 0.96em;
  }
  .readout .warn { color: #c62828; }

  .note-block {
    font-size: 0.85em;
    color: #555;
    background: #f1f3f5;
    border-left: 3px solid #adb5bd;
    padding: 10px 14px;
    margin: 12px 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .note-block p { text-align: left; margin: 0 0 8px 0; }
  .note-block p:last-child { margin-bottom: 0; }

  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #ccc;
    font-size: 0.85em;
    color: #555;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: justify;
  }
  .footer a { color: #1565c0; }
  .citation {
    font-size: 0.95em;
    color: #666;
    margin-top: 12px;
    text-align: left;
  }

  @media (prefers-reduced-motion: reduce) {
    .live { transition: none; }
  }
</style>
</head>
<body>
<div class="article-container">
