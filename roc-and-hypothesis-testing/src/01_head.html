<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Detection &amp; Hypothesis Testing: An Interactive Explorer</title>
<style>
  body {
    font-family: 'Georgia', serif;
    line-height: 1.7;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    font-size: 16px;
    background-color: #fafafa;
    color: #212529;
  }

  .article-container {
    background-color: white;
    padding: 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
  }

  h1.page-title {
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 1px;
    margin-top: 0;
    margin-bottom: 4px;
    font-size: 1.9em;
  }
  p.lede {
    text-align: justify;
    color: #444;
    margin: 0 auto 28px auto;
    max-width: 46em;
  }

  .citation {
    font-size: 0.82em;
    color: #666;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin-top: 12px;
    text-align: left;
  }

  h3 {
    text-align: center;
    font-variant: small-caps;
    margin-top: 40px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  h4 { margin: 18px 0 10px 0; }
  h5 { font-size: 1.05em; margin: 12px 0 8px 0; }

  p { text-align: justify; margin-bottom: 15px; }

  hr { border: none; border-top: 1px solid #dee2e6; margin: 22px 0; }

  /* ---- top-level mode / tab switchers ---- */
  .mode-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-tab {
    padding: 10px 20px;
    background-color: #e9ecef;
    border: 2px solid #dee2e6;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95em;
  }
  .mode-tab.active {
    background-color: #2c7fb8;
    color: white;
    border-color: #2c7fb8;
  }
  .tab-row {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 2px solid #dee2e6;
  }
  .tab-btn {
    padding: 10px 18px;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95em;
    font-weight: 600;
    color: #555;
    margin-bottom: -2px;
  }
  .tab-btn.active {
    color: #2c7fb8;
    border-bottom-color: #2c7fb8;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ---- controls ---- */
  .ctl { margin-bottom: 14px; }
  .ctl > label {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .ctl select, .ctl input[type=number] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.95em;
    background: #fff;
  }
  .ctl input[type=range] { width: 100%; }
  .ctl .slider-val {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85em;
    color: #2c7fb8;
    font-weight: 700;
  }
  .ctl.checkbox label {
    display: flex; align-items: center; gap: 8px; font-weight: 500;
  }
  .ctl.checkbox input { width: auto; }
  .ctl .radio-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .ctl .radio-row.stacked { flex-direction: column; gap: 4px; }
  .ctl .radio-row label {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.9em; font-weight: 500; cursor: pointer;
  }
  .ctl.disabled { opacity: 0.5; pointer-events: none; }
  .readonly-val {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95em;
    font-weight: 700;
    color: #2c7fb8;
    background: #eef2f5;
    border: 1px solid #dde3e8;
    border-radius: 4px;
    padding: 5px 8px;
  }
  .readonly-val .ro-note { font-weight: 400; color: #6c757d; font-size: 0.85em; }
  .help-text {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.82em;
    color: #6c757d;
    margin: -8px 0 12px 0;
  }

  button.btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.9em;
    padding: 7px 14px;
    margin: 3px 4px 3px 0;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    background-color: #e7e7e7;
    border-color: #ccc;
  }
  button.btn:hover { filter: brightness(0.94); }
  button.btn-primary   { background-color: #2c7fb8; color: #fff; border-color: #2c7fb8; }
  button.btn-warning   { background-color: #ffc107; color: #212529; border-color: #ffc107; }
  button.btn-info      { background-color: #17a2b8; color: #fff; border-color: #17a2b8; }
  button.btn-sm        { font-size: 0.82em; padding: 5px 10px; }

  /* ---- layout ---- */
  .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
  .row > .col { padding: 0 10px; box-sizing: border-box; }
  .col-4  { flex: 0 0 33.3333%; max-width: 33.3333%; }
  .col-6  { flex: 0 0 50%;     max-width: 50%; }
  .col-8  { flex: 0 0 66.6667%; max-width: 66.6667%; }
  .col-12 { flex: 0 0 100%;    max-width: 100%; }
  @media (max-width: 800px) {
    .row > .col { flex: 0 0 100%; max-width: 100%; }
    .article-container { padding: 18px; }
    body { padding: 8px; }
  }

  .sidebar {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 18px;
  }

  canvas.plot { width: 100%; display: block; }
  .plot-container {
    margin: 16px 0;
    padding: 12px;
    background-color: white;
    border-radius: 4px;
    border: 1px solid #ddd;
  }

  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.86em;
    margin-top: 10px;
    background: #fff;
  }
  table.tbl th, table.tbl td {
    border: 1px solid #dee2e6;
    padding: 6px 8px;
    text-align: center;
  }
  table.tbl th { background-color: #f1f3f5; }
  table.tbl tbody tr:nth-child(odd) { background-color: #f9f9f9; }
  table.tbl td.lbl { text-align: left; }

  /* confusion / decision matrix */
  .conf-table { border-collapse: collapse; width: 100%; text-align: center; table-layout: fixed; margin-top: 10px; }
  .conf-table td, .conf-table th { border: 2px solid #fff; padding: 16px 8px; font-weight: bold; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .conf-table th.label-cell { background-color: #f1f3f5; color: #333; font-size: 0.85em; font-weight: 600; }
  .conf-table td { font-size: 0.9em; color: #222; }

  /* comparison table */
  .comparison-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.88em; }
  .comparison-table th, .comparison-table td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; }
  .comparison-table th { background-color: #f8f9fa; }
  .comparison-table tr:nth-child(even) { background-color: #f9f9f9; }
  .sdt-col { background-color: #e3f2fd !important; }
  .ht-col  { background-color: #fff3e0 !important; }

  /* decision / interpretation boxes */
  .result-box { padding: 14px 16px; margin: 10px 0; border-radius: 5px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.92em; }
  .reject-h0          { background-color: #ffcccc; border: 2px solid #d62728; }
  .fail-reject         { background-color: #cce5ff; border: 2px solid #1f77b4; }
  .correct-decision    { background-color: #d4edda; border: 2px solid #28a745; }
  .incorrect-decision  { background-color: #f8d7da; border: 2px solid #dc3545; }

  /* severity boxes */
  .severity-box { padding: 14px 16px; margin: 10px 0; border-radius: 5px; background-color: #f5f5f5; border: 1px solid #ddd; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.92em; }
  .severity-high   { background-color: #c8e6c9; border-color: #4caf50; }
  .severity-medium { background-color: #fff9c4; border-color: #fbc02d; }
  .severity-low    { background-color: #ffcdd2; border-color: #e53935; }
  .severity-bar { height: 18px; border-radius: 3px; margin: 6px 0; }

  .key-insight {
    background-color: #fff3cd;
    border-left: 4px solid #ffc107;
    padding: 14px 16px;
    margin: 15px 0;
    border-radius: 4px;
    font-size: 0.95em;
  }

  /* severity assessment badges */
  .assess { font-weight: 700; }
  .assess-pass { color: #2e7d32; }
  .assess-weak { color: #ef6c00; }
  .assess-bent { color: #c62828; }
  tr.claim-current td { background-color: #fff3cd !important; font-weight: 700; }

  /* dual-label rows on the Comparison page */
  .dual-label {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin: 6px 0 14px 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
  }
  .dual-label > div { flex: 1 1 0; padding: 10px 12px; border-radius: 5px; }
  .dual-label .lab-name { font-weight: 700; display: block; margin-bottom: 2px; }
  .dual-label .lab-val { font-variant-numeric: tabular-nums; }
  .equals {
    align-self: center;
    font-weight: 700;
    color: #666;
    font-size: 1.1em;
  }
  .compare-legend {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85em;
    color: #555;
    text-align: center;
    margin-top: -6px;
  }
  .swatch-sdt, .swatch-ht {
    display: inline-block; width: 11px; height: 11px;
    border-radius: 2px; vertical-align: baseline; margin-right: 4px;
  }
  .swatch-sdt { background: #90caf9; }
  .swatch-ht  { background: #ffcc80; }
  .note-block {
    font-size: 0.85em;
    color: #555;
    background: #f1f3f5;
    border-left: 3px solid #adb5bd;
    padding: 10px 14px;
    margin: 12px 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .provenance-box {
    background-color: #e8f4f8;
    border-left: 3px solid #2c7fb8;
    padding: 14px 16px;
    margin: 15px 0 30px 0;
    border-radius: 4px;
    font-size: 0.92em;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #333;
  }
  .provenance-box a { color: #1565c0; }

  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #ccc;
    font-size: 0.85em;
    color: #555;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: justify;
  }
</style>
</head>
<body>
<div class="article-container">
