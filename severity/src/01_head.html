<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Severity: How Well Was This Claim Actually Tested?</title>
<style>
  body {
    font-family: 'Georgia', serif;
    line-height: 1.7;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    font-size: 16px;
    background-color: #fafafa;
    color: #212529;
  }

  .article-container {
    background-color: white;
    padding: 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
  }

  h1.page-title {
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 1px;
    margin-top: 0;
    margin-bottom: 4px;
    font-size: 1.9em;
  }
  p.lede {
    text-align: justify;
    color: #444;
    margin: 0 auto 28px auto;
    max-width: 46em;
  }

  blockquote.definition {
    margin: 0 auto 22px auto;
    max-width: 40em;
    padding: 16px 22px;
    border-left: 3px solid #2c7fb8;
    background-color: #f4f8fb;
    border-radius: 0 4px 4px 0;
  }
  blockquote.definition p {
    margin: 0 0 8px 0;
    font-size: 1.06em;
    text-align: left;
  }
  blockquote.definition cite {
    display: block;
    font-style: normal;
    font-size: 0.8em;
    color: #555;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
  }

  .citation {
    font-size: 0.82em;
    color: #666;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin-top: 12px;
    text-align: left;
  }

  h3 {
    text-align: center;
    font-variant: small-caps;
    margin-top: 40px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  h4 { margin: 18px 0 10px 0; }
  h5 { font-size: 1.05em; margin: 12px 0 8px 0; }

  p { text-align: justify; margin-bottom: 15px; }

  hr { border: none; border-top: 1px solid #dee2e6; margin: 22px 0; }

  /* ---- controls ---- */
  .ctl { margin-bottom: 14px; }
  .ctl > label {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .ctl select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.95em;
    background: #fff;
    box-sizing: border-box;
  }
  .ctl input[type=range] { width: 100%; }
  .ctl.checkbox label {
    display: flex; align-items: center; gap: 8px; font-weight: 500;
  }
  .ctl.checkbox input { width: auto; }
  .ctl .slider-val {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85em;
    color: #2c7fb8;
    font-weight: 700;
  }
  button.btn {
    width: 100%;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.88em;
    font-weight: 600;
    padding: 8px 12px;
    margin: 0 0 10px 0;
    border: 1px solid #b0bec5;
    border-radius: 4px;
    cursor: pointer;
    background-color: #fff;
    color: #37474f;
  }
  button.btn:hover { background-color: #eceff1; }
  button.btn:active { background-color: #cfd8dc; }

  .help-text {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.82em;
    color: #6c757d;
    margin: -8px 0 12px 0;
  }

  /* ---- layout ---- */
  .row { display: flex; flex-wrap: wrap; margin: 0 -10px; }
  .row > .col { padding: 0 10px; box-sizing: border-box; }
  .col-4  { flex: 0 0 33.3333%; max-width: 33.3333%; }
  .col-8  { flex: 0 0 66.6667%; max-width: 66.6667%; }
  @media (max-width: 800px) {
    .row > .col { flex: 0 0 100%; max-width: 100%; }
    .article-container { padding: 18px; }
    body { padding: 8px; }
  }

  .sidebar {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 18px;
  }

  canvas.plot { width: 100%; display: block; }
  /* a horizontal drag moves a marker line; a vertical swipe still scrolls */
  canvas.plot.draggable { touch-action: pan-y; }
  .plot-container {
    margin: 16px 0;
    padding: 12px;
    background-color: white;
    border-radius: 4px;
    border: 1px solid #ddd;
  }
  .plot-hint {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78em;
    color: #6c757d;
    text-align: center;
    margin: 2px 0 0 0;
  }

  /* ---- disclosures: the numbers behind the picture, and rarely-touched
         controls, both folded away by default ---- */
  details.fold { margin: 14px 0; }
  details.fold > summary {
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.86em;
    font-weight: 600;
    color: #2c7fb8;
    padding: 5px 0;
    list-style: none;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '\25B8\00a0'; }
  details.fold[open] > summary::before { content: '\25BE\00a0'; }
  .sidebar details.fold { margin: 8px 0 0 0; }
  .sidebar details.fold > summary { font-size: 0.82em; }

  .table-scroll { overflow-x: auto; }

  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.86em;
    margin-top: 10px;
    background: #fff;
  }
  table.tbl th, table.tbl td {
    border: 1px solid #dee2e6;
    padding: 6px 8px;
    text-align: center;
  }
  table.tbl th { background-color: #f1f3f5; }
  table.tbl tbody tr:nth-child(odd) { background-color: #f9f9f9; }
  table.tbl td.lbl { text-align: left; }

  /* Decision boxes are deliberately colourless. Red, amber and green are
     reserved for severity alone, so that a coloured thing on this page always
     means the same thing: how well a claim came through its test. The verdict
     of the test is a separate matter and is left in slate. */
  .result-box { padding: 14px 16px; margin: 10px 0; border-radius: 5px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.92em; }
  .reject-h0    { background-color: #eceff1; border: 1px solid #cfd8dc; border-left: 4px solid #455a64; }
  .fail-reject  { background-color: #f5f7f8; border: 1px solid #dde3e6; border-left: 4px solid #90a4ae; }

  /* severity boxes — the reserved ramp */
  .severity-box { padding: 14px 16px; margin: 10px 0; border-radius: 5px; background-color: #f5f5f5; border: 1px solid #ddd; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.92em; }
  .severity-high   { background-color: #c8e6c9; border-color: #4caf50; }
  .severity-medium { background-color: #fff9c4; border-color: #fbc02d; }
  .severity-low    { background-color: #ffcdd2; border-color: #e53935; }
  .severity-bar { height: 18px; border-radius: 3px; margin: 6px 0; }
  .sev-headline {
    font-size: 1.5em; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .sev-headline .sev-level { font-size: 0.5em; font-weight: 600; margin-left: 6px; }

  /* severity assessment badges */
  .assess { font-weight: 700; }
  .assess-pass { color: #2e7d32; }
  .assess-weak { color: #ef6c00; }
  .assess-bent { color: #c62828; }
  tr.claim-current td { background-color: #fff3cd !important; font-weight: 700; }

  .note-block {
    font-size: 0.85em;
    color: #555;
    background: #f1f3f5;
    border-left: 3px solid #adb5bd;
    padding: 10px 14px;
    margin: 12px 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #ccc;
    font-size: 0.85em;
    color: #555;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: justify;
  }
  .footer a { color: #1565c0; }
</style>
</head>
<body>
<div class="article-container">
